<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vanvaar Studios</title>
    <style>
        /* Global Reset & Smooth Performance */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #064E3B; /* Emerald Ink Theme Color */
            color: #ffffff;
            padding-bottom: 70px; /* Space for bottom nav */
            -webkit-font-smoothing: antialiased;
        }

        /* Top Header Brand */
        header {
            padding: 20px;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 1.5px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Hero Content Section */
        .hero {
            padding: 30px 20px;
        }

        .hero h1 {
            font-size: 38px;
            line-height: 1.2;
            margin-bottom: 15px;
            font-weight: 700;
        }

        .hero p {
            font-size: 15px;
            color: #D1D5DB;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        /* Action Buttons */
        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            text-align: center;
            background-color: #ffffff;
            color: #064E3B;
            font-weight: 600;
            border-radius: 30px;
            text-decoration: none;
            font-size: 16px;
            transition: opacity 0.2s ease;
        }

        .btn-outline {
            background-color: transparent;
            color: #ffffff;
            border: 1.5px solid rgba(255, 255, 255, 0.4);
        }

        .btn:active {
            opacity: 0.8;
        }

        /* X.com Style Transparent Glassmorphism Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background-color: rgba(6, 78, 59, 0.85); /* Transparent Emerald Ink */
            backdrop-filter: blur(10px); /* Smooth blur effect */
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            z-index: 999;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #9CA3AF; /* Unselected icon color */
            text-decoration: none;
            font-size: 11px;
            flex: 1;
            transition: color 0.2s;
        }

        .nav-item svg {
            width: 22px;
            height: 22px;
            margin-bottom: 2px;
            fill: currentColor;
        }

        /* Active / Current Page color */
        .nav-item.active, .nav-item:hover {
            color: #ffffff;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        VANVAAR
    </header>

    <!-- Main Content Area -->
    <main class="hero">
        <p style="font-size: 12px; letter-spacing: 2px; color: #A7F3D0; margin-bottom: 5px;">VANVAAR STUDIOS</p>
        <h1>Stories Beyond Imagination.</h1>
        <p>Original movies, worlds and games created by VANVAAR with lightweight performance.</p>
        
        <div class="btn-container">
            <a href="#movies" class="btn">Explore Movies</a>
            <a href="#games" class="btn btn-outline">Discover Games</a>
        </div>
    </main>

    <!-- X-Style Bottom Navigation Bar (Home -> Games -> Movies -> Profile) -->
    <nav class="bottom-nav">
        <!-- Home -->
        <a href="#" class="nav-item active">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <span>Home</span>
        </a>
        
        <!-- Games -->
        <a href="#games" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M21 6H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-10 7H8v2H6v-2H4v-2h2V9h2v2h3v2zm4.5 2c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm3-3c-.83 0-1.5-.67-1.5-1.5S17.67 9 18.5 9s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
            <span>Games</span>
        </a>
        
        <!-- Movies -->
        <a href="#movies" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M18 4l2 4h-3l-2-4h-2l2 4h-3l-2-4H8l2 4H7L5 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4h-4z"/></svg>
            <span>Movies</span>
        </a>
        
        <!-- Profile -->
        <a href="#profile" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            <span>Profile</span>
        </a>
    </nav>

</body>
    </html>
